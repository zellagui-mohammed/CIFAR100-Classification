
seed: 42

data:
  batch_size: 128
  val_size: 5000
  augment: true
  num_workers: 2
  image_size: 224
  normalization: imagenet

training:
  epochs: 20
  optimizer: adamw
  backbone_lr: 0.0001
  classifier_lr: 0.001
  weight_decay: 0.0001
  scheduler: cosine
  early_stopping_patience: 7

model:
  name: resnet18
  num_classes: 100
  freeze_backbone: false
  trainable_layers:
    - layer3
    - layer4
    - fc
